{% macro service_card(service) %}
<article class="group flex flex-col rounded-3xl border border-slate-200 bg-white p-5 shadow-sm transition duration-200 hover:-translate-y-1 hover:shadow-xl hover:shadow-slate-200/60">
  <div class="flex items-start justify-between gap-4">
    <span class="rounded-full bg-slate-100 px-3 py-1 text-xs font-semibold text-slate-600">{{ service.category }}</span>
    {% if service.featured %}<span class="text-xs font-semibold text-amber-600">Featured</span>{% endif %}
  </div>
  <div class="mt-7 h-12 w-12 rounded-2xl bg-{{ service.color }}-100" aria-hidden="true"></div>
  <h3 class="mt-6 text-xl font-bold text-ink">{{ service.name }}</h3>
  <p class="mt-3 flex-1 text-sm leading-6 text-slate-600">{{ service.description }}</p>
  <div class="mt-7 flex items-end justify-between border-t border-slate-100 pt-4">
    <div><p class="text-xs text-slate-400">Starting at</p><p class="mt-1 text-lg font-bold text-ink">{{ service.price }}</p></div>
    <p class="text-sm text-slate-500">{{ service.duration }}</p>
  </div>
</article>
{% endmacro %}
